[experiment]
name = "repository-aware-change-impact"
manifest = "data/tasks.jsonl"
results_dir = "runs"
prediction_limit = 10

[context]
source_budget_chars = 96000
dependency_budget_chars = 24000
supplementary_budget_chars = 24000

[models.local]
enabled = true
provider = "ollama"
base_url = "http://127.0.0.1:11434"
model_tag = "qwen2.5-coder:7b"
timeout_seconds = 180
num_ctx = 32768
temperature = 0.0
seed = 42
top_p = 1.0
top_k = 40
repeat_penalty = 1.0
num_predict = 2048
response_format = "json"

[models.cloud]
enabled = false
provider = "openai-compatible"
base_url_env = "CIA_CLOUD_BASE_URL"
model_env = "CIA_CLOUD_MODEL"
api_key_env = "CIA_CLOUD_API_KEY"
timeout_seconds = 180

